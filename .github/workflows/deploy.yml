name: Production CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  REGISTRY: gcr.io
  PROJECT_ID: secret-proton-465722-q0
  SERVICE_NAME: mindtunnel-resume
  REGION: us-central1
  
jobs:
  # ============================================================================
  # BUILD AND DEPLOY
  # ============================================================================
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}
        
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      
    - name: Configure Docker for GCR
      run: gcloud auth configure-docker --quiet
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Compute image tag
      run: echo "IMAGE_TAG=gcr.io/${{ env.PROJECT_ID }}/resume-app:$(date +%Y%m%d)-${GITHUB_SHA::8}" >> $GITHUB_ENV

    # The image build is the only build: npm ci and next build run inside the
    # Dockerfile. Layers are cached in GitHub Actions so unchanged dependencies
    # are not reinstalled on every push.
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ env.IMAGE_TAG }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy ${{ env.SERVICE_NAME }} \
          --image=${{ env.IMAGE_TAG }} \
          --platform=managed \
          --region=${{ env.REGION }} \
          --allow-unauthenticated \
          --port=3000 \
          --memory=512Mi \
          --cpu=1 \
          --cpu-boost \
          --max-instances=10 \
          --min-instances=0 \
          --set-env-vars="NODE_ENV=production" \
          --project=${{ env.PROJECT_ID }} \
          --quiet
          
    - name: Verify deployment
      run: |
        echo "🎉 Deployment completed!"
        echo "✅ Service: ${{ env.SERVICE_NAME }}"
        echo "✅ Region: ${{ env.REGION }}"
        echo "✅ URL: https://resume.mindtunnel.org"
        echo "✅ Health endpoint: https://resume.mindtunnel.org/api/health"
        
        # Wait for deployment to be ready
        sleep 30
        
        # Test health endpoint
        if curl -f -s https://resume.mindtunnel.org/api/health; then
          echo "✅ Health endpoint is working!"
        else
          echo "⏳ Health endpoint not yet available (may take a few minutes)"
        fi
